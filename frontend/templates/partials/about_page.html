        <h2 data-i18n="aboutIntroTitle">簡介</h2>
        <p data-i18n="aboutIntroBody1">我們是 No Fold，CCU-Taiwan iGEM 團隊，由國立中正大學各學院的學生所組成，涵蓋理學院、工學院、社會科學院、文學院，以及跨領域學士學位學程的同學。</p>
        <p data-i18n="aboutIntroBody2">我們團隊計畫利用生物合成學的方式，開發可用於驅趕農業害蟲瘤野螟的系統，希望大家了解農藥對世界的危害以及增進大眾對有機稻米的認知。</p>
